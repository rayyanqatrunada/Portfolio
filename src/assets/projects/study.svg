<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <!-- Background -->
  <rect width="800" height="500" fill="#EAEAEA"/>
  
  <!-- Terminal / Code Editor Frame -->
  <rect x="50" y="40" width="700" height="420" rx="4" fill="#FFFFFF" stroke="#D1D1D1" stroke-width="2"/>
  <rect x="50" y="40" width="700" height="36" fill="#F4F4F4" stroke="#D1D1D1" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="75" cy="58" r="5" fill="#C4C4C4"/>
  <circle cx="95" cy="58" r="5" fill="#C4C4C4"/>
  <circle cx="115" cy="58" r="5" fill="#C4C4C4"/>
  <text x="145" y="62" font-family="monospace" font-size="11" fill="#777777">github.com/rayyanqatrunada/Study :: main branch</text>
  
  <!-- Header Bar -->
  <rect x="80" y="96" width="130" height="20" fill="#171717"/>
  <text x="92" y="110" font-family="sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" letter-spacing="1">STUDY ARCHIVE</text>
  <rect x="540" y="96" width="170" height="20" fill="#F0F0F0" stroke="#E0E0E0"/>
  <text x="555" y="110" font-family="sans-serif" font-size="10" fill="#666666">Knowledge &amp; Code Lab</text>

  <!-- Left Column: Directory / Topic Hierarchy -->
  <rect x="80" y="130" width="220" height="300" fill="#FAFAFA" stroke="#E5E5E5" rx="2"/>
  <rect x="80" y="130" width="220" height="30" fill="#F0F0F0" stroke="#E5E5E5"/>
  <text x="95" y="150" font-family="sans-serif" font-weight="700" font-size="10" fill="#171717">LEARNING TOPICS</text>

  <!-- Topic 1: Python -->
  <rect x="92" y="170" width="196" height="32" fill="#EAEAEA" rx="2"/>
  <text x="104" y="190" font-family="monospace" font-weight="600" font-size="11" fill="#171717">📁 Python /</text>
  <text x="104" y="222" font-family="monospace" font-size="10" fill="#666666">  ├── core_syntax.py</text>
  <text x="104" y="242" font-family="monospace" font-size="10" fill="#666666">  ├── data_structures.py</text>
  <text x="104" y="262" font-family="monospace" font-size="10" fill="#666666">  └── algorithms.py</text>

  <!-- Topic 2: Web Fundamentals -->
  <text x="104" y="295" font-family="monospace" font-weight="600" font-size="11" fill="#171717">📁 html, css /</text>
  <text x="104" y="315" font-family="monospace" font-size="10" fill="#666666">  ├── responsive_grid/</text>
  <text x="104" y="335" font-family="monospace" font-size="10" fill="#666666">  └── semantic_layout/</text>

  <!-- Topic 3: Notes -->
  <text x="104" y="368" font-family="monospace" font-weight="600" font-size="11" fill="#171717">📄 README.md</text>
  <text x="104" y="398" font-family="monospace" font-size="9" fill="#999999">[ Continuous Research ]</text>

  <!-- Right Column: Code Snippet / Experiment Terminal -->
  <rect x="320" y="130" width="390" height="300" fill="#171717" rx="2"/>
  <rect x="320" y="130" width="390" height="28" fill="#262626"/>
  <text x="335" y="148" font-family="monospace" font-size="10" fill="#A3A3A3">Python/algorithms.py — UTF-8</text>

  <!-- Python Code lines -->
  <text x="335" y="180" font-family="monospace" font-size="11" fill="#888888"># Continuous Study &amp; Algorithmic Experiments</text>
  <text x="335" y="202" font-family="monospace" font-size="11" fill="#60A5FA">def <tspan fill="#FDE047">binary_search</tspan><tspan fill="#E5E5E5">(arr: list[int], target: int) -&gt; int:</tspan></text>
  <text x="355" y="224" font-family="monospace" font-size="11" fill="#E5E5E5">low, high = <tspan fill="#A3E635">0</tspan>, len(arr) - <tspan fill="#A3E635">1</tspan></text>
  <text x="355" y="246" font-family="monospace" font-size="11" fill="#F43F5E">while <tspan fill="#E5E5E5">low &lt;= high:</tspan></text>
  <text x="375" y="268" font-family="monospace" font-size="11" fill="#E5E5E5">mid = (low + high) // <tspan fill="#A3E635">2</tspan></text>
  <text x="375" y="290" font-family="monospace" font-size="11" fill="#F43F5E">if <tspan fill="#E5E5E5">arr[mid] == target:</tspan></text>
  <text x="395" y="312" font-family="monospace" font-size="11" fill="#F43F5E">return <tspan fill="#E5E5E5">mid</tspan></text>
  <text x="375" y="334" font-family="monospace" font-size="11" fill="#F43F5E">elif <tspan fill="#E5E5E5">arr[mid] &lt; target:</tspan></text>
  <text x="395" y="356" font-family="monospace" font-size="11" fill="#E5E5E5">low = mid + <tspan fill="#A3E635">1</tspan></text>
  <text x="375" y="378" font-family="monospace" font-size="11" fill="#F43F5E">else<tspan fill="#E5E5E5">:</tspan></text>
  <text x="395" y="400" font-family="monospace" font-size="11" fill="#E5E5E5">high = mid - <tspan fill="#A3E635">1</tspan></text>
  <text x="355" y="420" font-family="monospace" font-size="11" fill="#F43F5E">return <tspan fill="#60A5FA">-1</tspan></text>
</svg>
