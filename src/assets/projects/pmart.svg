<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <!-- Background -->
  <rect width="800" height="500" fill="#EAEAEA"/>
  
  <!-- Browser Frame -->
  <rect x="50" y="40" width="700" height="420" rx="4" fill="#FFFFFF" stroke="#D1D1D1" stroke-width="2"/>
  <rect x="50" y="40" width="700" height="36" fill="#F4F4F4" stroke="#D1D1D1" stroke-width="1"/>
  
  <!-- Browser Window Dots -->
  <circle cx="75" cy="58" r="5" fill="#C4C4C4"/>
  <circle cx="95" cy="58" r="5" fill="#C4C4C4"/>
  <circle cx="115" cy="58" r="5" fill="#C4C4C4"/>
  
  <!-- Address bar -->
  <rect x="145" y="48" width="510" height="20" rx="3" fill="#FFFFFF" stroke="#E0E0E0"/>
  <text x="160" y="62" font-family="monospace" font-size="11" fill="#777777">pmart-commerce.local/api/orders/ledger</text>
  
  <!-- Header Bar -->
  <rect x="80" y="96" width="120" height="20" fill="#171717"/>
  <text x="92" y="110" font-family="sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" letter-spacing="1">PMART ENGINE</text>
  <rect x="540" y="96" width="170" height="20" fill="#F0F0F0" stroke="#E0E0E0"/>
  <text x="555" y="110" font-family="sans-serif" font-size="10" fill="#666666">Student Merchant Hub</text>

  <!-- Metric Badges Row -->
  <rect x="80" y="130" width="190" height="60" fill="#FAFAFA" stroke="#E5E5E5" rx="2"/>
  <text x="95" y="152" font-family="sans-serif" font-size="10" fill="#666666">ACTIVE MERCHANTS</text>
  <text x="95" y="176" font-family="monospace" font-weight="700" font-size="18" fill="#171717">38 Stores</text>

  <rect x="290" y="130" width="190" height="60" fill="#FAFAFA" stroke="#E5E5E5" rx="2"/>
  <text x="305" y="152" font-family="sans-serif" font-size="10" fill="#666666">QUEUED TRANSACTIONS</text>
  <text x="305" y="176" font-family="monospace" font-weight="700" font-size="18" fill="#171717">142 Requests</text>

  <rect x="500" y="130" width="210" height="60" fill="#FAFAFA" stroke="#E5E5E5" rx="2"/>
  <text x="515" y="152" font-family="sans-serif" font-size="10" fill="#666666">INVENTORY MUTATIONS</text>
  <text x="515" y="176" font-family="monospace" font-weight="700" font-size="18" fill="#171717">Realtime Sync</text>

  <!-- Main Order Processing & Transaction Queue -->
  <rect x="80" y="210" width="630" height="220" fill="#FFFFFF" stroke="#E5E5E5"/>
  <rect x="80" y="210" width="630" height="32" fill="#F5F5F5" stroke="#E5E5E5"/>
  <text x="100" y="231" font-family="sans-serif" font-weight="700" font-size="10" fill="#333333">TRANSACTION ID</text>
  <text x="260" y="231" font-family="sans-serif" font-weight="700" font-size="10" fill="#333333">MERCHANT BOOTH</text>
  <text x="430" y="231" font-family="sans-serif" font-weight="700" font-size="10" fill="#333333">ITEMS &amp; QTY</text>
  <text x="590" y="231" font-family="sans-serif" font-weight="700" font-size="10" fill="#333333">SETTLEMENT</text>

  <!-- Row 1 -->
  <line x1="80" y1="275" x2="710" y2="275" stroke="#F0F0F0"/>
  <text x="100" y="265" font-family="monospace" font-size="11" fill="#171717">TRX-2026-04918</text>
  <text x="260" y="265" font-family="sans-serif" font-size="11" fill="#444444">Booth Pemasaran 1</text>
  <text x="430" y="265" font-family="sans-serif" font-size="11" fill="#666666">Paket Snack Box (x12)</text>
  <rect x="590" y="252" width="75" height="18" rx="2" fill="#EAEAEA"/>
  <text x="600" y="265" font-family="sans-serif" font-weight="600" font-size="9" fill="#171717">VERIFIED</text>

  <!-- Row 2 -->
  <line x1="80" y1="315" x2="710" y2="315" stroke="#F0F0F0"/>
  <text x="100" y="305" font-family="monospace" font-size="11" fill="#171717">TRX-2026-04919</text>
  <text x="260" y="305" font-family="sans-serif" font-size="11" fill="#444444">Booth Minuman Kreatif</text>
  <text x="430" y="305" font-family="sans-serif" font-size="11" fill="#666666">Matcha Latte (x4)</text>
  <rect x="590" y="292" width="75" height="18" rx="2" fill="#EAEAEA"/>
  <text x="600" y="305" font-family="sans-serif" font-weight="600" font-size="9" fill="#171717">VERIFIED</text>

  <!-- Bottom Technical Highlight -->
  <rect x="100" y="340" width="590" height="75" fill="#F8F8F8" stroke="#DCDCDC" rx="2"/>
  <text x="115" y="362" font-family="sans-serif" font-weight="700" font-size="10" fill="#171717" letter-spacing="1">DATA PROCESSING HIGHLIGHTS</text>
  <text x="115" y="382" font-family="monospace" font-size="10" fill="#555555">Database transaction blocks ensure race-condition prevention during peak order submission.</text>
  <text x="115" y="399" font-family="monospace" font-size="10" fill="#777777">Relational tables: merchants [1:N] items [1:N] order_details [N:1] transactions.</text>
</svg>
