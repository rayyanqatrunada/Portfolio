<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <!-- Background -->
  <rect width="800" height="500" fill="#EAEAEA"/>
  
  <!-- Terminal / Code Editor Frame -->
  <rect x="50" y="40" width="700" height="420" rx="4" fill="#FFFFFF" stroke="#D1D1D1" stroke-width="2"/>
  <rect x="50" y="40" width="700" height="36" fill="#F4F4F4" stroke="#D1D1D1" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="75" cy="58" r="5" fill="#C4C4C4"/>
  <circle cx="95" cy="58" r="5" fill="#C4C4C4"/>
  <circle cx="115" cy="58" r="5" fill="#C4C4C4"/>
  <text x="145" y="62" font-family="monospace" font-size="11" fill="#777777">api-service-gateway :: HTTP/1.1 POST /api/v1/checkout/process</text>
  
  <!-- Left Column: Endpoint Routes & Middleware Stack -->
  <rect x="80" y="100" width="280" height="330" fill="#FAFAFA" stroke="#E5E5E5" rx="2"/>
  <text x="95" y="125" font-family="sans-serif" font-weight="700" font-size="11" fill="#171717">API ROUTE REGISTRY</text>

  <!-- Route 1 -->
  <rect x="95" y="140" width="250" height="42" fill="#FFFFFF" stroke="#EAEAEA" rx="2"/>
  <rect x="105" y="152" width="40" height="18" fill="#171717" rx="2"/>
  <text x="112" y="165" font-family="monospace" font-weight="700" font-size="9" fill="#FFFFFF">GET</text>
  <text x="155" y="165" font-family="monospace" font-size="11" fill="#333333">/api/v1/products</text>

  <!-- Route 2 -->
  <rect x="95" y="190" width="250" height="42" fill="#FFFFFF" stroke="#EAEAEA" rx="2"/>
  <rect x="105" y="202" width="40" height="18" fill="#555555" rx="2"/>
  <text x="109" y="215" font-family="monospace" font-weight="700" font-size="9" fill="#FFFFFF">POST</text>
  <text x="155" y="215" font-family="monospace" font-size="11" fill="#333333">/api/v1/auth/login</text>

  <!-- Route 3 -->
  <rect x="95" y="240" width="250" height="42" fill="#FFFFFF" stroke="#EAEAEA" rx="2"/>
  <rect x="105" y="252" width="40" height="18" fill="#171717" rx="2"/>
  <text x="109" y="265" font-family="monospace" font-weight="700" font-size="9" fill="#FFFFFF">POST</text>
  <text x="155" y="265" font-family="monospace" font-size="11" fill="#333333">/api/v1/orders</text>

  <!-- Middleware specs -->
  <rect x="95" y="295" width="250" height="120" fill="#F0F0F0" stroke="#DDDDDD" rx="2"/>
  <text x="105" y="315" font-family="sans-serif" font-weight="700" font-size="10" fill="#171717">MIDDLEWARE PIPELINE</text>
  <text x="105" y="335" font-family="monospace" font-size="10" fill="#666666">1. RequestRateLimiter (60 req/min)</text>
  <text x="105" y="355" font-family="monospace" font-size="10" fill="#666666">2. TokenBearerAuthentication</text>
  <text x="105" y="375" font-family="monospace" font-size="10" fill="#666666">3. PayloadValidator &amp; Sanitizer</text>
  <text x="105" y="395" font-family="monospace" font-size="10" fill="#666666">4. StructuredResponseTransformer</text>

  <!-- Right Column: JSON Response Viewer -->
  <rect x="380" y="100" width="330" height="330" fill="#171717" rx="2"/>
  <rect x="380" y="100" width="330" height="28" fill="#262626"/>
  <text x="395" y="118" font-family="monospace" font-size="10" fill="#A3A3A3">HTTP 200 OK | application/json (18ms)</text>

  <text x="395" y="150" font-family="monospace" font-size="11" fill="#CCCCCC">{</text>
  <text x="410" y="170" font-family="monospace" font-size="11" fill="#E5E5E5">"status": <tspan fill="#A3E635">"success"</tspan>,</text>
  <text x="410" y="190" font-family="monospace" font-size="11" fill="#E5E5E5">"code": <tspan fill="#38BDF8">200</tspan>,</text>
  <text x="410" y="210" font-family="monospace" font-size="11" fill="#E5E5E5">"data": {</text>
  <text x="425" y="230" font-family="monospace" font-size="11" fill="#E5E5E5">"order_id": <tspan fill="#A3E635">"ORD-88210"</tspan>,</text>
  <text x="425" y="250" font-family="monospace" font-size="11" fill="#E5E5E5">"customer_id": <tspan fill="#38BDF8">412</tspan>,</text>
  <text x="425" y="270" font-family="monospace" font-size="11" fill="#E5E5E5">"items_count": <tspan fill="#38BDF8">3</tspan>,</text>
  <text x="425" y="290" font-family="monospace" font-size="11" fill="#E5E5E5">"payment_status": <tspan fill="#A3E635">"settled"</tspan></text>
  <text x="410" y="310" font-family="monospace" font-size="11" fill="#E5E5E5">},</text>
  <text x="410" y="330" font-family="monospace" font-size="11" fill="#E5E5E5">"meta": {</text>
  <text x="425" y="350" font-family="monospace" font-size="11" fill="#E5E5E5">"timestamp": <tspan fill="#FDE047">"2026-10-14T13:20:00Z"</tspan></text>
  <text x="410" y="370" font-family="monospace" font-size="11" fill="#E5E5E5">}</text>
  <text x="395" y="390" font-family="monospace" font-size="11" fill="#CCCCCC">}</text>
</svg>
